<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gray-100 flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
        <h2 class="text-3xl font-semibold text-center text-blue-600 mb-6">Login</h2>
        <form id="loginform" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required placeholder="Masukan Emailmu" class="w-full px-4 py-2 mt-1 border rounded-lg focus:outline-none focus:ring focus-blue-300" />
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukan Passwordmu" class="w-full px-4 py-2 mt-1 border rounded-lg focus:outline-none focus:ring focus-blue-300" />
            </div>
            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="mr-2 rounded" />
                    <span class="text-sm text-gray-700">Ingat saya</span>
                </label>
                <a href="#" class="text-sm text-blue-600 hover:underline">Lupa password?</a>
            </div>
            <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition mt-2">Submit</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">Belum punya akun? <a href="#" class="text-blue-500 hover:underline">Daftar</a></p>
    </div>
    <script>
    function handleLogin(event){
        event.preventDefault();

        if(email && password){
            alert("Login berhasil");
        } else {
            alert("Email dan Password harus diisi");
        }
    }
    </script>
</body>
</html>
